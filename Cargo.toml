[workspace]
members = [
  "crates/xifty-core",
  "crates/xifty-source",
  "crates/xifty-detect",
  "crates/xifty-container-jpeg",
  "crates/xifty-container-tiff",
  "crates/xifty-container-png",
  "crates/xifty-container-riff",
  "crates/xifty-container-isobmff",
  "crates/xifty-container-flac",
  "crates/xifty-container-ogg",
  "crates/xifty-container-aiff",
  "crates/xifty-container-id3",
  "crates/xifty-container-gif",
  "crates/xifty-container-raf",
  "crates/xifty-container-rw2",
  "crates/xifty-meta-exif",
  "crates/xifty-meta-icc",
  "crates/xifty-meta-iptc",
  "crates/xifty-meta-ai-gen",
  "crates/xifty-meta-c2pa",
  "crates/xifty-meta-id3v2",
  "crates/xifty-meta-apple",
  "crates/xifty-meta-bwf",
  "crates/xifty-meta-ixml",
  "crates/xifty-meta-sony",
  "crates/xifty-meta-sony-video",
  "crates/xifty-meta-nikon",
  "crates/xifty-meta-olympus",
  "crates/xifty-meta-canon",
  "crates/xifty-meta-fuji",
  "crates/xifty-meta-panasonic",
  "crates/xifty-meta-xmp",
  "crates/xifty-meta-quicktime",
  "crates/xifty-meta-itunes",
  "crates/xifty-meta-rtmd",
  "crates/xifty-meta-vorbis-comment",
  "crates/xifty-normalize",
  "crates/xifty-policy",
  "crates/xifty-sidecar",
  "crates/xifty-sidecar-sony-nrt",
  "crates/xifty-sidecar-subtitles",
  "crates/xifty-sidecar-gopro",
  "crates/xifty-sidecar-c2pa",
  "crates/xifty-validate",
  "crates/xifty-json",
  "crates/xifty-ffi",
  "crates/xifty-cli",
  "crates/xifty-wasm",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.14"
authors = ["XIFty Contributors"]

[workspace.dependencies]
clap = { version = "4.5.40", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
flate2 = "1.1.4"
plist = "1.7.0"
quick-xml = "0.38"
thiserror = "2.0.17"
insta = { version = "1.43.2", features = ["json"] }
ciborium = "0.2"
